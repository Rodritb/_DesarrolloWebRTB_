<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 5px;
        }
        body{
            height: 100vh;
            margin: 30px;
            background-color: rgb(255, 255, 255);
        }
        form{
            display: flex;
            flex-direction: column;
            width: 350px;
            background-color: whitesmoke;
        }
        button{
            width: 200px;
            height: 30px;
            background-color: rgb(42, 42, 212);
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form action="" id="miForm">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre">
        <span id="err_nombre" class="error" style="display:none;color:red"></span>
        <br><br>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email">
        <span id="err_email" class="error" style="display:none;color:red"></span>
        <br><br>
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena">
        <span id="err_contrasena" class="error" style="display:none;color:red"></span>
        <br><br>
        <label for="telefono">Teléfono (Bolivia)</label>
        <input type="text" id="telefono" name="telefono">
        <span id="err_telefono" class="error" style="display:none;color:red"></span>
        <br><br>
        <button type="submit">Registrar</button>
    </form>

    <script src="validar.js" >
    </script>
</body>
</html>
