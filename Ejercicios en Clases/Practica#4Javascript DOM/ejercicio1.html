<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Colores 5x5</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        td {
            width: 60px;
            height: 60px;
            border: 1px solid #333;
            background-color: #fff;
            cursor: pointer;
            transition: transform 0.1s;
        }

        td:hover {
            border: 2px solid #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 100px;
            height: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Selector de Colores para Tabla</h2>
    <div id="contenedor-tabla"></div>

    <script>
        filas = 5;
        columnas = 5;
        contenedor = document.getElementById('contenedor-tabla');

        tabla = document.createElement('table');
        inputColor = document.createElement('input');
        inputColor.type = 'color';
        inputColor.value = '#3498db'; 

        for (let i = 0; i < filas; i++) {
            fila = document.createElement('tr');
            
            for (let j = 0; j < columnas; j++) {
                celda = document.createElement('td');
                celda.addEventListener('click', function() {
                    this.style.backgroundColor = inputColor.value;
                });

                fila.appendChild(celda);
            }
            tabla.appendChild(fila);
        }

        contenedor.appendChild(tabla);
        
        divControls = document.createElement('div');
        divControls.className = 'controls';
        divControls.innerHTML = '<label>Selecciona un color:</label>';
        divControls.appendChild(inputColor);
        
        contenedor.appendChild(divControls);
    </script>

</body>
</html>
